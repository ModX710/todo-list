<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- สีหลักของเว็บ (ตรงกับแบบใน Figma "Todo List – Vibrant") ---------- */
    :root {
      --text: #1E1B3A;
      --muted: #8E8AA8;
      --line: #EEEAF8;
      --orange: #FF8A4C;
      --pink: #FF4F9A;
      --purple: #7B5CFF;
      --yellow: #FFC94D;
      --green: #2ED39A;
      --blue: #3D8BFF;
      --track: #F1EEFB;
      --input-bg: #F7F5FD;
      --check-line: #C9C3E8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans Thai", -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--orange), var(--pink) 50%, var(--purple));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(77, 26, 102, 0.25);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ---------- ส่วนหัว ---------- */
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .greeting { margin: 0 0 2px; color: var(--muted); font-size: 14px; font-weight: 500; }
    h1 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.3; }

    .streak {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      box-shadow: 0 8px 18px rgba(255, 138, 76, 0.35);
    }
    .streak .count { display: flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 700; line-height: 1.3; }
    .streak small { font-size: 11px; font-weight: 600; }

    /* ---------- คำคมประจำวัน ---------- */
    .quote {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(90deg, var(--purple), var(--pink));
    }
    .quote svg { flex-shrink: 0; }
    .quote p { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.5; }
    .quote small { font-size: 12px; opacity: 0.8; }

    /* ---------- ความคืบหน้า ---------- */
    .progress-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    .progress-top b { color: var(--pink); }
    .bar { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
    .bar div {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--yellow), var(--orange), var(--pink));
      transition: width 0.6s ease;
    }

    /* ---------- ช่องเพิ่มงาน ---------- */
    .add-form {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 18px;
      border-radius: 999px;
      background: var(--input-bg);
      border: 1.5px solid var(--line);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-form:focus-within { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255, 79, 154, 0.12); }
    .add-form input {
      flex: 1;
      min-width: 0;
      border: none;
      background: none;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }
    .add-form input::placeholder { color: var(--muted); }
    .add-form select {
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--purple);
      background: #EEE9FF;
      cursor: pointer;
      outline: none;
    }
    .add-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 6px 14px rgba(255, 79, 154, 0.35);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .add-btn:hover { transform: scale(1.08) rotate(90deg); }

    /* ---------- รายการงาน ---------- */
    .lists { display: flex; flex-direction: column; gap: 20px; }
    .section-title { margin: 0 0 10px 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    li.new { animation: pop-in 0.3s ease; }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      background: #fff;
      box-shadow: 0 6px 16px rgba(123, 92, 255, 0.08);
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .item:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(123, 92, 255, 0.14); }

    .check {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2.5px solid var(--check-line);
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }
    .check svg { opacity: 0; transform: scale(0.4); transition: all 0.2s; }
    .item:hover .check { border-color: var(--pink); }

    .body { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
    .title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .done .item { background: #F2FBF7; border-color: #CFF3E4; box-shadow: none; }
    .done .check { border: none; background: linear-gradient(135deg, var(--green), var(--blue)); }
    .done .check svg { opacity: 1; transform: scale(1); }
    .done .title { color: var(--muted); font-weight: 400; text-decoration: line-through; }
    .done .tag { opacity: 0.6; }

    .celebrate {
      padding: 16px;
      border-radius: 18px;
      text-align: center;
      font-weight: 700;
      color: #0E9F6E;
      background: linear-gradient(90deg, #E3FAF1, #E6F0FF);
    }
    .empty { text-align: center; color: var(--muted); padding: 12px 0; margin: 0; }
    [hidden] { display: none !important; }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .card { padding: 22px 16px; border-radius: 22px; }
      h1 { font-size: 24px; }
      .add-form { padding-left: 14px; }
    }

    /* ---------- หน้าล็อกอิน ---------- */
    .auth h1 { text-align: center; }
    .auth .sub { margin: -16px 0 0; text-align: center; color: var(--muted); }
    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--input-bg); }
    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 999px;
      background: none;
      font: inherit;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .tabs button.active { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(123, 92, 255, 0.15); }
    .auth form { display: flex; flex-direction: column; gap: 12px; }
    .auth input {
      padding: 14px 18px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      background: var(--input-bg);
      font: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }
    .auth input:focus { border-color: var(--pink); }
    .primary-btn {
      padding: 14px;
      border: none;
      border-radius: 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 8px 18px rgba(255, 79, 154, 0.3);
      cursor: pointer;
    }
    .primary-btn:disabled { opacity: 0.6; cursor: wait; }
    .notice { margin: 0; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
    .notice.error { background: #FFE6EC; color: #C2255C; }
    .notice.ok { background: #E3FAF1; color: #0E9F6E; }

    /* ---------- แถบบัญชี + นำเข้างานเดิม + แจ้งเตือน ---------- */
    .account { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .link-btn { border: none; background: none; padding: 0; font: inherit; color: var(--pink); font-weight: 600; cursor: pointer; }
    .import { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #FFF6E0; font-size: 14px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--text);
      color: #fff;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
</head>
<body>
  <!-- ===== หน้าล็อกอิน / สมัครสมาชิก ===== -->
  <main class="card auth" id="auth-view" hidden>
    <h1>Todo List</h1>
    <p class="sub">ล็อกอินเพื่อเก็บงานของคุณไว้ใช้ได้ทุกเครื่อง</p>
    <div class="tabs">
      <button type="button" class="active" data-mode="login">เข้าสู่ระบบ</button>
      <button type="button" data-mode="signup">สมัครสมาชิก</button>
    </div>
    <form id="auth-form">
      <input id="email" type="email" placeholder="อีเมล" autocomplete="email" required>
      <input id="password" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" minlength="6" autocomplete="current-password" required>
      <button class="primary-btn" id="auth-btn" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p class="notice" id="auth-notice" hidden></p>
  </main>

  <!-- ===== หน้ารายการงาน ===== -->
  <main class="card" id="app-view" hidden>
    <div class="header">
      <div>
        <p class="greeting" id="greeting">สวัสดี</p>
        <h1>วันนี้ลุยกันเลย!</h1>
      </div>
      <div class="streak" id="streak-box">
        <span class="count">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c1 3.5 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2.4 1.1-4 2.3-5 0 2.2 1 3.3 2.2 3.3 0-3.3-1-6 1-9.3z" fill="#fff"/></svg>
          <span id="streak">0</span>
        </span>
        <small>วันติด</small>
      </div>
    </div>

    <div class="quote">
      <svg width="28" height="28" viewBox="0 0 24 24"><path d="M11 2l2.2 6.3 6.3 2.2-6.3 2.2L11 19l-2.2-6.3L2.5 10.5l6.3-2.2z" fill="#fff"/><path d="M19 14l.9 2.1 2.1.9-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z" fill="#fff" fill-opacity="0.8"/></svg>
      <div>
        <p id="quote"></p>
        <small>แรงบันดาลใจประจำวัน</small>
      </div>
    </div>

    <div>
      <div class="progress-top">
        <span id="message"></span>
        <b id="count">0/0</b>
      </div>
      <div class="bar"><div id="bar" style="width: 0%"></div></div>
    </div>

    <form class="add-form" id="add-form">
      <input id="title" placeholder="วันนี้อยากทำอะไรให้สำเร็จ?" autocomplete="off" autofocus required>
      <select id="category" aria-label="หมวดหมู่"></select>
      <button class="add-btn" type="submit" aria-label="เพิ่มงาน">+</button>
    </form>

    <div class="import" id="import-box" hidden>
      <span id="import-text"></span>
      <button class="link-btn" id="import-btn" type="button">นำเข้า</button>
    </div>

    <div class="lists">
      <p class="empty" id="loading">กำลังโหลดงาน...</p>
      <p class="empty" id="empty" hidden>ยังไม่มีงาน เริ่มเพิ่มงานแรกด้านบนเลย</p>
      <div class="celebrate" id="celebrate">ทำครบทุกงานแล้ว เก่งมาก! พักผ่อนให้เต็มที่นะ</div>
      <section id="todo-section">
        <h2 class="section-title" id="todo-title"></h2>
        <ul id="todo-list"></ul>
      </section>
      <section id="done-section">
        <h2 class="section-title" id="done-title"></h2>
        <ul id="done-list"></ul>
      </section>
    </div>

    <div class="account">
      <span id="user-email"></span> · <button class="link-btn" id="logout-btn" type="button">ออกจากระบบ</button>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script>
    // ================= ตั้งค่า Supabase =================
    // ค่าจาก Supabase โปรเจกต์ todo-list (Project URL + publishable key)
    // ทั้งสองค่านี้ใส่ในหน้าเว็บได้ ไม่ใช่ความลับ — ความปลอดภัยมาจาก Row Level Security ใน schema.sql
    const SUPABASE_URL = "https://bzxgvnakjbiolcsednqn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zPqb5JBxk1jEMDTKQE8Aug_W8Hhmuf4";

    // หมวดหมู่งาน: รหัส -> [ชื่อที่แสดง, สีพื้นป้าย, สีตัวอักษร]
    const CATEGORIES = {
      learn: ["การเรียนรู้", "#E6F0FF", "#2563EB"],
      health: ["สุขภาพ", "#E3FAF1", "#0E9F6E"],
      family: ["ครอบครัว", "#FFF0E3", "#E8590C"],
      work: ["งาน", "#EEE9FF", "#6D4AFF"],
      shop: ["ของใช้", "#FFE6F1", "#D6336C"],
      other: ["ทั่วไป", "#F1F1F6", "#6B6884"],
    };

    // คำคมประจำวัน เปลี่ยนไปเรื่อยๆ วันละข้อ
    const QUOTES = [
      "ทุกงานเล็กๆ ที่ทำเสร็จ คือก้าวที่ใกล้ฝันขึ้นอีกนิด",
      "ไม่ต้องเร็ว แค่อย่าหยุด",
      "วันนี้ทำให้ดีที่สุด พรุ่งนี้จะขอบคุณตัวเอง",
      "เริ่มจากสิ่งที่ทำได้ แล้วสิ่งที่ยากจะง่ายขึ้น",
      "ความสำเร็จใหญ่ๆ เกิดจากวันธรรมดาที่ไม่ยอมแพ้",
      "ทำทีละอย่าง แต่ทำให้เสร็จ",
      "คู่แข่งคนเดียวที่ต้องชนะ คือตัวเราเมื่อวาน",
    ];

    const $ = id => document.getElementById(id);
    const configured = !SUPABASE_URL.startsWith("YOUR_");
    const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let todos = [];
    let currentUser = null;

    // ---------- แจ้งเตือนสั้นๆ ด้านล่างจอ ----------
    let toastTimer;
    function toast(text) {
      const el = $("toast");
      el.textContent = text;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.hidden = true), 4000);
    }

    // วันที่แบบ "2026-10-10" ตามเวลาเครื่อง
    function dayKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // นับว่าทำงานเสร็จต่อเนื่องกี่วันติด (นับถึงวันนี้ หรือถึงเมื่อวานถ้าวันนี้ยังไม่ได้ทำ)
    function calcStreak() {
      const days = new Set(todos.filter(t => t.done && t.done_at).map(t => t.done_at));
      const day = new Date();
      if (!days.has(dayKey(day))) day.setDate(day.getDate() - 1);
      let streak = 0;
      while (days.has(dayKey(day))) {
        streak++;
        day.setDate(day.getDate() - 1);
      }
      return streak;
    }

    function progressMessage(done, total) {
      const left = total - done;
      if (total === 0) return "เพิ่มงานแรกของวันกันเลย!";
      if (done === 0) return `เริ่มจากงานแรกกันเลย! มีทั้งหมด ${total} งาน`;
      if (done === total) return "สุดยอด! ทำครบทุกงานแล้ว";
      if (done * 2 < total) return `เริ่มต้นได้ดี! อีก ${left} งานเท่านั้น`;
      return `มาไกลแล้ว! อีก ${left} งานก็ครบ`;
    }

    // ---------- สร้างแถวงาน 1 แถว ----------
    const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

    function renderItem(todo, isNew) {
      const [label, bg, fg] = CATEGORIES[todo.category] || CATEGORIES.other;
      const li = document.createElement("li");
      if (todo.done) li.classList.add("done");
      if (isNew) li.classList.add("new");

      const btn = document.createElement("button");
      btn.className = "item";
      btn.type = "button";
      btn.innerHTML = `<span class="check">${CHECK_SVG}</span>`;
      btn.addEventListener("click", () => toggle(todo));

      const body = document.createElement("span");
      body.className = "body";
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = todo.title; // textContent กันโค้ดแปลกๆ ที่ผู้ใช้พิมพ์มา
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = label;
      tag.style.background = bg;
      tag.style.color = fg;
      body.append(title, tag);
      btn.append(body);
      li.append(btn);
      return li;
    }

    // ---------- วาดหน้าจอใหม่ทั้งหมดจากข้อมูล ----------
    function render(newId = null) {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;

      $("streak").textContent = calcStreak();
      $("message").textContent = progressMessage(done, total);
      $("count").textContent = `${done}/${total}`;
      $("bar").style.width = `${total ? (done * 100) / total : 0}%`;

      $("todo-list").replaceChildren();
      $("done-list").replaceChildren();
      for (const t of todos) $(t.done ? "done-list" : "todo-list").append(renderItem(t, t.id === newId));

      $("todo-title").textContent = `ต้องทำวันนี้ · ${total - done}`;
      $("done-title").textContent = `ทำสำเร็จแล้ว · ${done}`;
      $("loading").hidden = true;
      $("empty").hidden = total !== 0;
      $("celebrate").hidden = !(total > 0 && done === total);
      $("todo-section").hidden = done === total;
      $("done-section").hidden = done === 0;
    }

    // ================= ฐานข้อมูล =================
    async function loadTodos() {
      $("loading").hidden = false;
      const { data, error } = await db.from("todos").select("*").order("created_at");
      if (error) {
        $("loading").textContent = "โหลดงานไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง";
        return;
      }
      todos = data;
      render();
    }

    async function addTodo(title, category) {
      const { data, error } = await db.from("todos").insert({ title, category }).select().single();
      if (error) return toast("เพิ่มงานไม่สำเร็จ ลองอีกครั้งนะ");
      todos.push(data);
      render(data.id);
    }

    // ติ๊กทันทีให้รู้สึกเร็ว แล้วค่อยบันทึก ถ้าบันทึกไม่ได้จะย้อนกลับ
    async function toggle(todo) {
      const before = { done: todo.done, done_at: todo.done_at };
      todo.done = !todo.done;
      todo.done_at = todo.done ? dayKey(new Date()) : null;
      render();
      const { error } = await db.from("todos").update({ done: todo.done, done_at: todo.done_at }).eq("id", todo.id);
      if (error) {
        Object.assign(todo, before);
        render();
        toast("บันทึกไม่สำเร็จ ลองอีกครั้งนะ");
      }
    }

    // ---------- นำเข้างานเดิมที่เคยเก็บในเบราว์เซอร์ (เวอร์ชันก่อนมีฐานข้อมูล) ----------
    function oldLocalTodos() {
      try {
        return JSON.parse(localStorage.getItem("todos")) || [];
      } catch {
        return [];
      }
    }

    function showImportBox() {
      const old = oldLocalTodos();
      $("import-box").hidden = old.length === 0;
      $("import-text").textContent = `พบงานเดิมในเบราว์เซอร์นี้ ${old.length} งาน`;
    }

    $("import-btn").addEventListener("click", async () => {
      const rows = oldLocalTodos().map(t => ({
        title: String(t.title).slice(0, 200),
        category: CATEGORIES[t.category] ? t.category : "other",
        done: !!t.done,
        done_at: t.done ? t.done_at || null : null,
      }));
      const { error } = await db.from("todos").insert(rows);
      if (error) return toast("นำเข้าไม่สำเร็จ ลองอีกครั้งนะ");
      try { localStorage.removeItem("todos"); } catch {}
      $("import-box").hidden = true;
      toast(`นำเข้า ${rows.length} งานแล้ว`);
      loadTodos();
    });

    // ================= ล็อกอิน / สมัครสมาชิก =================
    let mode = "login";

    function notice(text, kind = "error") {
      const el = $("auth-notice");
      el.textContent = text;
      el.className = `notice ${kind}`;
      el.hidden = !text;
    }

    for (const tab of document.querySelectorAll(".tabs button")) {
      tab.addEventListener("click", () => {
        mode = tab.dataset.mode;
        document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === tab));
        $("auth-btn").textContent = mode === "login" ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
        $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
        notice("");
      });
    }

    function authErrorText(error) {
      const msg = error.message || "";
      if (/invalid login/i.test(msg)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
      if (/not confirmed/i.test(msg)) return "ยังไม่ได้ยืนยันอีเมล กรุณากดลิงก์ในอีเมลที่เราส่งไปก่อน";
      if (/already registered/i.test(msg)) return "อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน";
      if (/password/i.test(msg)) return "รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร";
      if (/rate limit/i.test(msg)) return "ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่";
      return "เกิดข้อผิดพลาด ลองอีกครั้งนะ";
    }

    $("auth-form").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("email").value.trim();
      const password = $("password").value;
      $("auth-btn").disabled = true;
      notice("");
      if (mode === "login") {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) notice(authErrorText(error));
      } else {
        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: location.origin + location.pathname },
        });
        if (error) notice(authErrorText(error));
        else if (!data.session) notice("สมัครสำเร็จ! เปิดอีเมลแล้วกดลิงก์ยืนยัน จากนั้นกลับมาเข้าสู่ระบบ", "ok");
      }
      $("auth-btn").disabled = false;
    });

    $("logout-btn").addEventListener("click", () => db.auth.signOut());

    // สลับหน้าตามสถานะล็อกอิน
    function showView(user) {
      $("auth-view").hidden = !!user;
      $("app-view").hidden = !user;
    }

    // ---------- เมนูหมวดหมู่ ----------
    const select = $("category");
    for (const [key, [label]] of Object.entries(CATEGORIES)) {
      select.add(new Option(label, key, key === "other", key === "other"));
    }

    // ---------- เพิ่มงาน ----------
    $("add-form").addEventListener("submit", async e => {
      e.preventDefault();
      const input = $("title");
      const title = input.value.trim();
      if (!title) return;
      input.value = "";
      input.focus();
      await addTodo(title, select.value);
    });

    // ---------- คำทักทาย วันที่ และคำคม ----------
    const now = new Date();
    const h = now.getHours();
    const hello = h < 12 ? "สวัสดีตอนเช้า" : h < 17 ? "สวัสดีตอนบ่าย" : "สวัสดีตอนเย็น";
    const dateText = now.toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short" });
    $("greeting").textContent = `${hello} · ${dateText}`;
    const dayNumber = Math.floor((now - now.getTimezoneOffset() * 60000) / 86400000);
    $("quote").textContent = QUOTES[dayNumber % QUOTES.length];

    // ---------- เริ่มต้น ----------
    if (!configured) {
      showView(null);
      $("auth-form").hidden = true;
      document.querySelector(".tabs").hidden = true;
      notice("ยังไม่ได้ตั้งค่า Supabase — ใส่ SUPABASE_URL และ SUPABASE_ANON_KEY ในไฟล์ index.html");
    } else {
      db.auth.onAuthStateChange((event, session) => {
        const user = session?.user ?? null;
        showView(user);
        if (user && user.id !== currentUser?.id) {
          currentUser = user;
          $("user-email").textContent = user.email;
          // รอให้ระบบล็อกอินทำงานเสร็จก่อนค่อยดึงข้อมูล
          setTimeout(() => {
            loadTodos();
            showImportBox();
          });
        } else if (!user) {
          currentUser = null;
          todos = [];
        }
      });
    }
  </script>
</body>
</html>
